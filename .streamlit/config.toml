[theme]
base = "light"
primaryColor = "#D50000"
backgroundColor = "#F2F3F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111418"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Barlow Condensed':https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap"
baseRadius = "0.4rem"
borderColor = "#E1E4E8"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
