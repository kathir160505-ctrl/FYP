# Copy to .streamlit/secrets.toml (git-ignored) and fill in to enable optional features.
# YouTube Data API v3 key: lets the match centre play official highlights in the app.
# Create one free at https://console.cloud.google.com/ (enable "YouTube Data API v3", then Credentials > API key).
YOUTUBE_API_KEY = ""

# Extensions beyond the FYP1 proposal (Matchday, Players, match centre, 2026/27 season, honours and managers).
# On by default. Set to false to show only the five pages the FYP1 proposal describes.
SHOW_EXTENSIONS = true
